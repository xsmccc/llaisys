<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLAISYS Chat</title>
<!-- marked.js for Markdown rendering (local) -->
<script src="/static/marked.min.js"></script>
<!-- highlight.js for code syntax highlighting (local) -->
<link rel="stylesheet" href="/static/github-dark.min.css">
<script src="/static/highlight.min.js"></script>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0d1117;
  --bg-side:   #010409;
  --bg-card:   #161b22;
  --bg-input:  #1c2129;
  --border:    #30363d;
  --text:      #e6edf3;
  --text-dim:  #8b949e;
  --accent:    #58a6ff;
  --accent-hover: #79b8ff;
  --user-bg:   #1f3a5f;
  --think-bg:  #1a1e2a;
  --think-bd:  #3d4663;
  --error:     #f85149;
  --success:   #3fb950;
  --radius:    10px;
  --sidebar-w: 280px;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ===== Layout ===== */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ===== Sidebar ===== */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--bg-side); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 14px;
  transition: margin-left 0.25s ease;
}
#sidebar.collapsed { margin-left: calc(var(--sidebar-w) * -1); }
.sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.sidebar-brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.sidebar-brand .ver { font-size: 10px; color: var(--text-dim); background: var(--bg-card); padding: 2px 8px; border-radius: 12px; }
#new-chat-btn {
  width: 100%; padding: 9px; border: 1px dashed var(--border);
  background: transparent; color: var(--text); border-radius: var(--radius);
  cursor: pointer; font-size: 13px; transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
#new-chat-btn:hover { background: var(--bg-card); border-color: var(--accent); }
#new-chat-btn svg { width: 14px; height: 14px; }

/* ===== Conversation list ===== */
#conv-list { margin-top: 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.conv-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: var(--text-dim);
  transition: background 0.12s; border: 1px solid transparent; position: relative;
}
.conv-item:hover { background: var(--bg-card); }
.conv-item.active { background: var(--bg-card); color: var(--text); border-color: var(--border); }
.conv-item .conv-icon { flex-shrink: 0; font-size: 14px; }
.conv-item .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-item .conv-del {
  display: none; background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 15px; padding: 0 2px; line-height: 1; flex-shrink: 0;
}
.conv-item:hover .conv-del { display: block; }
.conv-item .conv-del:hover { color: var(--error); }

/* ===== Divider ===== */
.sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

/* ===== Params ===== */
.params h3 { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; letter-spacing: 1px; }
.param-row { margin-bottom: 12px; }
.param-row label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; color: var(--text-dim); }
.param-row label span { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.param-row input[type=range] { width: 100%; accent-color: var(--accent); height: 4px; }
.sidebar-footer { font-size: 10px; color: var(--text-dim); text-align: center; padding-top: 10px; border-top: 1px solid var(--border); }

/* ===== Chat Area ===== */
#chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  background: var(--bg-side); min-height: 48px;
}
#toggle-sidebar { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 6px; line-height: 1; }
#toggle-sidebar:hover { background: var(--bg-card); color: var(--text); }
#chat-header .model-name { font-size: 14px; font-weight: 600; }
#chat-header .status { font-size: 12px; color: var(--text-dim); margin-left: auto; display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }
.status-dot.busy { background: #d29922; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ===== Messages ===== */
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }

/* Welcome screen */
.welcome { text-align: center; margin: auto; max-width: 520px; }
.welcome .logo { font-size: 48px; margin-bottom: 12px; }
.welcome h2 { font-size: 22px; margin-bottom: 6px; font-weight: 600; }
.welcome p { color: var(--text-dim); font-size: 14px; line-height: 1.6; }
.welcome .tips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
.welcome .tip {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 12px 14px; border-radius: var(--radius); font-size: 13px;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
  text-align: left; display: flex; align-items: flex-start; gap: 8px;
}
.welcome .tip:hover { border-color: var(--accent); background: #161b2299; }
.welcome .tip .tip-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.welcome .tip .tip-text { line-height: 1.4; }

/* ===== Message bubbles ===== */
.msg { display: flex; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
.msg.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; margin-top: 2px;
}
.msg.user .msg-avatar { background: #1f6feb; }
.msg.assistant .msg-avatar { background: #238636; }
.msg-body { flex: 1; min-width: 0; }
.msg.user .msg-body { text-align: right; }
.msg-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; padding: 0 2px; }
.msg.user .msg-meta { text-align: right; }
.msg-content {
  display: inline-block; text-align: left;
  padding: 10px 16px; border-radius: var(--radius);
  line-height: 1.7; font-size: 14px; word-break: break-word;
  max-width: 100%; position: relative;
}
.msg.user .msg-content { background: var(--user-bg); border-bottom-right-radius: 2px; white-space: pre-wrap; }
.msg.assistant .msg-content { background: var(--bg-card); border-bottom-left-radius: 2px; width: 100%; }

/* ===== Thinking block ===== */
.thinking-block {
  background: var(--think-bg); border-left: 3px solid var(--think-bd);
  border-radius: 6px; margin-bottom: 8px; overflow: hidden;
}
.thinking-toggle {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--text-dim);
  user-select: none; width: 100%; background: none; border: none;
}
.thinking-toggle:hover { color: var(--text); }
.thinking-toggle .arrow { transition: transform 0.2s; display: inline-block; font-size: 10px; }
.thinking-block.open .thinking-toggle .arrow { transform: rotate(90deg); }
.thinking-content {
  display: none; padding: 4px 12px 12px; font-size: 13px; color: var(--text-dim);
  line-height: 1.6; white-space: pre-wrap;
}
.thinking-block.open .thinking-content { display: block; }
.thinking-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--think-bd); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Markdown (answer) ===== */
.answer-content { line-height: 1.7; }
.answer-content p { margin: 0.4em 0; }
.answer-content h1, .answer-content h2, .answer-content h3,
.answer-content h4, .answer-content h5, .answer-content h6 {
  margin: 0.8em 0 0.4em; font-weight: 600; line-height: 1.3;
}
.answer-content h1 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.answer-content h2 { font-size: 1.25em; }
.answer-content h3 { font-size: 1.1em; }
.answer-content ul, .answer-content ol { padding-left: 1.6em; margin: 0.4em 0; }
.answer-content li { margin: 0.2em 0; }
.answer-content blockquote {
  border-left: 3px solid var(--accent); padding: 4px 12px; margin: 0.5em 0;
  color: var(--text-dim); background: #161b2266; border-radius: 0 6px 6px 0;
}
.answer-content a { color: var(--accent); text-decoration: none; }
.answer-content a:hover { text-decoration: underline; }
.answer-content table { border-collapse: collapse; margin: 0.5em 0; width: 100%; font-size: 13px; }
.answer-content th, .answer-content td {
  border: 1px solid var(--border); padding: 6px 10px; text-align: left;
}
.answer-content th { background: var(--bg-side); font-weight: 600; }
.answer-content hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }
.answer-content img { max-width: 100%; border-radius: 6px; }

/* Code blocks */
.code-block { position: relative; margin: 0.6em 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.code-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; background: #1c2129; font-size: 12px; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
}
.code-header .lang { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.copy-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
  display: flex; align-items: center; gap: 4px; transition: all 0.15s;
}
.copy-btn:hover { color: var(--text); border-color: var(--text-dim); }
.copy-btn.copied { color: var(--success); border-color: var(--success); }
.code-block pre { margin: 0 !important; border: none !important; border-radius: 0 !important; }
.code-block pre code { padding: 12px !important; display: block; overflow-x: auto; font-size: 13px; line-height: 1.5; }

/* Inline code */
.answer-content code:not(pre code) {
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
  background: #1c2333; padding: 2px 6px; border-radius: 4px; font-size: 0.9em;
}
.answer-content pre code {
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
}

/* Loading dots */
.loading-dots span { display: inline-block; width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

/* ===== Input Area ===== */
#input-area { padding: 12px 20px 10px; border-top: 1px solid var(--border); background: var(--bg-side); }
.input-wrap {
  display: flex; align-items: flex-end; gap: 8px;
  max-width: 800px; margin: 0 auto;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px 12px;
  transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--accent); }
#user-input {
  flex: 1; background: none; border: none; color: var(--text);
  font-size: 14px; line-height: 1.5; resize: none; outline: none;
  min-height: 24px; max-height: 160px; font-family: inherit;
}
#user-input::placeholder { color: var(--text-dim); }
.input-actions { display: flex; gap: 4px; flex-shrink: 0; }
.action-btn {
  width: 34px; height: 34px; border-radius: 8px; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s;
}
#send-btn { background: var(--accent); color: #fff; }
#send-btn:hover { background: var(--accent-hover); }
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#stop-btn { background: var(--error); color: #fff; display: none; }
#stop-btn:hover { opacity: 0.85; }
.action-btn svg { width: 16px; height: 16px; }
.input-footer { text-align: center; font-size: 10px; color: var(--text-dim); margin-top: 6px; max-width: 800px; margin-left: auto; margin-right: auto; }

/* ===== Token stats bar ===== */
.token-stats { font-size: 11px; color: var(--text-dim); display: flex; gap: 12px; justify-content: center; margin-top: 4px; }
.token-stats span { display: flex; align-items: center; gap: 4px; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  :root { --sidebar-w: 260px; }
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; }
  #sidebar.collapsed { margin-left: 0; transform: translateX(-100%); }
  .welcome .tips { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <h1>LLAISYS</h1>
      <span class="ver">v0.1</span>
    </div>
    <button id="new-chat-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新对话
    </button>

    <div id="conv-list"></div>

    <hr class="sidebar-divider">

    <div class="params">
      <h3>生成参数</h3>
      <div class="param-row">
        <label>Temperature <span id="v-temp">0.6</span></label>
        <input type="range" id="p-temp" min="0" max="2" step="0.1" value="0.6">
      </div>
      <div class="param-row">
        <label>Top-K <span id="v-topk">50</span></label>
        <input type="range" id="p-topk" min="1" max="200" step="1" value="50">
      </div>
      <div class="param-row">
        <label>Top-P <span id="v-topp">0.95</span></label>
        <input type="range" id="p-topp" min="0.05" max="1" step="0.05" value="0.95">
      </div>
      <div class="param-row">
        <label>Max Tokens <span id="v-max">512</span></label>
        <input type="range" id="p-max" min="64" max="2048" step="64" value="512">
      </div>
    </div>

    <div class="sidebar-footer">LLAISYS Inference Framework</div>
  </nav>

  <!-- Main chat area -->
  <main id="chat">
    <header id="chat-header">
      <button id="toggle-sidebar" title="切换侧边栏">☰</button>
      <span class="model-name">DeepSeek-R1-Distill-Qwen-1.5B</span>
      <span class="status" id="status-text"><span class="status-dot" id="status-dot"></span> 就绪</span>
    </header>

    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="logo">🤖</div>
        <h2>LLAISYS Chat</h2>
        <p>基于 LLAISYS 推理框架运行的 DeepSeek-R1 模型<br>支持流式输出、Markdown 渲染、代码高亮</p>
        <div class="tips">
          <div class="tip" data-q="用简洁的语言解释什么是Transformer">
            <span class="tip-icon">💡</span>
            <span class="tip-text">Transformer 是什么？</span>
          </div>
          <div class="tip" data-q="用Python写一个快速排序算法，并解释时间复杂度">
            <span class="tip-icon">💻</span>
            <span class="tip-text">快速排序算法</span>
          </div>
          <div class="tip" data-q="KV Cache在LLM推理中的作用是什么？为什么需要它？">
            <span class="tip-icon">🧠</span>
            <span class="tip-text">KV Cache 的作用</span>
          </div>
          <div class="tip" data-q="解释CUDA编程中Grid、Block、Thread的关系">
            <span class="tip-icon">🔧</span>
            <span class="tip-text">CUDA 线程模型</span>
          </div>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div class="input-wrap">
        <textarea id="user-input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
        <div class="input-actions">
          <button id="send-btn" class="action-btn" title="发送 (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
          <button id="stop-btn" class="action-btn" title="停止生成">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
      <div class="input-footer">LLAISYS 推理框架 · 流式 SSE · OpenAI 兼容 API · Markdown + 代码高亮</div>
    </div>
  </main>
</div>

<script>
/* ================================================================
   LLAISYS Chat UI — Full-featured version
   Features: Markdown (marked.js), code highlighting (highlight.js),
   conversation list, copy code, stop generation, token stats
   ================================================================ */

/* ----- Configure marked (with fallback) ----- */
const HAS_MARKED = typeof marked !== 'undefined';
const HAS_HLJS = typeof hljs !== 'undefined';

if (HAS_MARKED && HAS_HLJS) {
  const markedRenderer = new marked.Renderer();
  markedRenderer.code = function({ text, lang }) {
    const language = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
    const label = lang || 'code';
    let highlighted;
    try { highlighted = hljs.highlight(text, { language }).value; }
    catch { highlighted = escapeHtml(text); }
    return `<div class="code-block">
      <div class="code-header"><span class="lang">${escapeHtml(label)}</span><button class="copy-btn" onclick="copyCode(this)">📋 复制</button></div>
      <pre><code class="hljs language-${language}">${highlighted}</code></pre>
    </div>`;
  };
  marked.setOptions({
    renderer: markedRenderer,
    breaks: true,
    gfm: true,
  });
} else if (HAS_MARKED) {
  marked.setOptions({ breaks: true, gfm: true });
}

/* ----- DOM refs ----- */
const sidebar     = document.getElementById('sidebar');
const toggleBtn   = document.getElementById('toggle-sidebar');
const newChatBtn  = document.getElementById('new-chat-btn');
const convList    = document.getElementById('conv-list');
const messagesDiv = document.getElementById('messages');
const welcomeDiv  = document.getElementById('welcome');
const userInput   = document.getElementById('user-input');
const sendBtn     = document.getElementById('send-btn');
const stopBtn     = document.getElementById('stop-btn');
const statusText  = document.getElementById('status-text');
const statusDot   = document.getElementById('status-dot');

const pTemp = document.getElementById('p-temp'), vTemp = document.getElementById('v-temp');
const pTopk = document.getElementById('p-topk'), vTopk = document.getElementById('v-topk');
const pTopp = document.getElementById('p-topp'), vTopp = document.getElementById('v-topp');
const pMax  = document.getElementById('p-max'),  vMax  = document.getElementById('v-max');
pTemp.oninput = () => vTemp.textContent = pTemp.value;
pTopk.oninput = () => vTopk.textContent = pTopk.value;
pTopp.oninput = () => vTopp.textContent = pTopp.value;
pMax.oninput  = () => vMax.textContent  = pMax.value;

/* ===== Conversation State ===== */
let conversations = JSON.parse(localStorage.getItem('llaisys_convs') || '[]');
let activeConvId = null;
let isGenerating = false;
let abortController = null;

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function timeStr() { return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
function saveConvs() { localStorage.setItem('llaisys_convs', JSON.stringify(conversations)); }

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

/* ----- Render conversation list ----- */
function renderConvList() {
  convList.innerHTML = '';
  for (const conv of conversations) {
    const div = document.createElement('div');
    div.className = 'conv-item' + (conv.id === activeConvId ? ' active' : '');
    div.innerHTML = `
      <span class="conv-icon">💬</span>
      <span class="conv-title">${escapeHtml(conv.title)}</span>
      <button class="conv-del" title="删除" data-id="${conv.id}">&times;</button>`;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('conv-del')) return;
      switchConversation(conv.id);
    });
    div.querySelector('.conv-del').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteConversation(conv.id);
    });
    convList.appendChild(div);
  }
}

function newConversation() {
  if (isGenerating) return;
  const conv = { id: genId(), title: '新对话', messages: [], created: Date.now() };
  conversations.unshift(conv);
  activeConvId = conv.id;
  saveConvs();
  renderConvList();
  renderMessages();
}

function switchConversation(id) {
  if (isGenerating || id === activeConvId) return;
  activeConvId = id;
  renderConvList();
  renderMessages();
}

function deleteConversation(id) {
  if (isGenerating) return;
  conversations = conversations.filter(c => c.id !== id);
  if (activeConvId === id) {
    activeConvId = conversations.length > 0 ? conversations[0].id : null;
  }
  saveConvs();
  renderConvList();
  renderMessages();
}

/* ----- Render all messages for active conversation ----- */
function renderMessages() {
  messagesDiv.innerHTML = '';
  const conv = getActiveConv();
  if (!conv || conv.messages.length === 0) {
    messagesDiv.appendChild(welcomeDiv);
    welcomeDiv.style.display = '';
    return;
  }
  welcomeDiv.style.display = 'none';
  for (const msg of conv.messages) {
    if (msg.role === 'user') {
      appendUserMsg(msg.content, msg.time, false);
    } else {
      const { contentEl } = appendAssistantMsg(msg.time, false);
      renderAssistantContent(contentEl, msg.content);
    }
  }
  scrollToBottom();
}

/* ----- Auto-title from first user message ----- */
function autoTitle(conv) {
  const first = conv.messages.find(m => m.role === 'user');
  if (first) {
    let t = first.content.slice(0, 24);
    if (first.content.length > 24) t += '…';
    conv.title = t;
  }
}

/* ===== Sidebar toggle ===== */
toggleBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

/* ===== New chat ===== */
newChatBtn.addEventListener('click', () => newConversation());

/* ===== Quick tip clicks ===== */
document.querySelectorAll('.tip').forEach(el => {
  el.addEventListener('click', () => {
    userInput.value = el.dataset.q;
    sendMessage();
  });
});

/* ===== Send / Stop ===== */
sendBtn.addEventListener('click', sendMessage);
stopBtn.addEventListener('click', () => { if (abortController) abortController.abort(); });
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
});

/* ===== Main send function ===== */
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isGenerating) return;

  /* Ensure we have an active conversation */
  if (!activeConvId) newConversation();
  const conv = getActiveConv();

  isGenerating = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'flex';
  setStatus('生成中…', true);
  welcomeDiv.style.display = 'none';

  /* Add user message */
  const now = timeStr();
  conv.messages.push({ role: 'user', content: text, time: now });
  autoTitle(conv);
  saveConvs();
  renderConvList();
  appendUserMsg(text, now);
  userInput.value = '';
  userInput.style.height = 'auto';

  /* Assistant placeholder */
  const { contentEl } = appendAssistantMsg(timeStr());
  contentEl.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

  abortController = new AbortController();
  let fullText = '';
  let promptTokens = 0;
  let completionTokens = 0;

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: abortController.signal,
      body: JSON.stringify({
        messages: conv.messages.filter(m => m.role !== undefined).map(m => ({ role: m.role, content: m.content })),
        stream: true,
        temperature: parseFloat(pTemp.value),
        top_k:       parseInt(pTopk.value),
        top_p:       parseFloat(pTopp.value),
        max_tokens:  parseInt(pMax.value),
      }),
    });

    if (!res.ok) {
      let detail = '';
      try { detail = await res.text(); } catch {}
      throw new Error(`HTTP ${res.status}: ${detail || res.statusText}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let firstChunk = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data: ')) continue;
        const data = trimmed.slice(6);
        if (data === '[DONE]') continue;
        try {
          const chunk = JSON.parse(data);
          const delta = chunk.choices?.[0]?.delta;
          if (delta?.content) {
            if (firstChunk) { contentEl.innerHTML = ''; firstChunk = false; }
            fullText += delta.content;
            completionTokens++;
            renderAssistantContent(contentEl, fullText);
            scrollToBottom();
          }
        } catch {}
      }
    }

    if (firstChunk) contentEl.innerHTML = '<em style="color:var(--text-dim)">（无输出）</em>';
    conv.messages.push({ role: 'assistant', content: fullText, time: timeStr() });
    saveConvs();

  } catch (err) {
    if (err.name === 'AbortError') {
      if (fullText) {
        conv.messages.push({ role: 'assistant', content: fullText, time: timeStr() });
        saveConvs();
        renderAssistantContent(contentEl, fullText + '\n\n*[生成已停止]*');
      } else {
        contentEl.innerHTML = '<em style="color:var(--text-dim)">已停止</em>';
      }
    } else {
      // Distinguish network errors from server errors
      let errMsg = err.message || '未知错误';
      let hint = '';
      if (err.message && (err.message.includes('Failed to fetch') || err.message.includes('NetworkError') || err.message.includes('network'))) {
        hint = '<br><small style="color:var(--text-dim)">服务器可能已崩溃或未启动。请检查终端日志并重启服务。<br>提示：如果对话过长，试试点击"新对话"重新开始。</small>';
      } else if (err.message && err.message.includes('HTTP')) {
        hint = '<br><small style="color:var(--text-dim)">输入可能超过模型最大序列长度，试试缩短消息或开新对话。</small>';
      }
      contentEl.innerHTML = `<span style="color:var(--error)">错误: ${escapeHtml(errMsg)}</span>${hint}`;
      // Save partial output if any
      if (fullText) {
        conv.messages.push({ role: 'assistant', content: fullText, time: timeStr() });
        saveConvs();
      }
    }
  } finally {
    isGenerating = false;
    abortController = null;
    sendBtn.style.display = 'flex';
    stopBtn.style.display = 'none';
    setStatus('就绪', false);
  }
}

/* ===== Status helper ===== */
function setStatus(text, busy) {
  statusText.innerHTML = `<span class="status-dot${busy ? ' busy' : ''}"></span> ${text}`;
}

/* ===== DOM helpers ===== */
function appendUserMsg(text, time, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="msg-avatar">U</div>
    <div class="msg-body">
      <div class="msg-meta">${time || ''}</div>
      <div class="msg-content">${escapeHtml(text)}</div>
    </div>`;
  messagesDiv.appendChild(div);
  if (scroll) scrollToBottom();
}

function appendAssistantMsg(time, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="msg-avatar">AI</div>
    <div class="msg-body">
      <div class="msg-meta">${time || ''}</div>
      <div class="msg-content"></div>
    </div>`;
  messagesDiv.appendChild(div);
  const contentEl = div.querySelector('.msg-content');
  if (scroll) scrollToBottom();
  return { msgEl: div, contentEl };
}

/* ===== Render assistant content with <think> + markdown ===== */
function renderAssistantContent(el, fullText) {
  /* DeepSeek-R1 chat template adds <think>\n at the end of the prompt,
     so the model output does NOT contain <think> — only </think>.
     We detect both formats:
       (A) <think>...thinking...</think>...answer    (standard)
       (B) ...thinking...</think>...answer            (DeepSeek-R1 style) */

  const thinkOpen = fullText.indexOf('<think>');
  const thinkClose = fullText.indexOf('</think>');

  // Case 1: No thinking tags at all → plain markdown
  if (thinkOpen === -1 && thinkClose === -1) {
    el.innerHTML = `<div class="answer-content">${renderMarkdown(fullText)}</div>`;
    return;
  }

  let thinkText = '';
  let answerText = '';
  let thinkDone = false;

  if (thinkOpen !== -1) {
    // Case 2 (A): Standard format — <think>...content...</think>
    const afterThinkTag = thinkOpen + '<think>'.length;
    if (thinkClose === -1) {
      // Still thinking...
      thinkText = fullText.substring(afterThinkTag);
    } else {
      thinkText = fullText.substring(afterThinkTag, thinkClose);
      answerText = fullText.substring(thinkClose + '</think>'.length).trim();
      thinkDone = true;
    }
  } else {
    // Case 3 (B): DeepSeek-R1 — no <think>, only </think>
    // Everything before </think> is thinking, everything after is answer
    if (thinkClose === -1) {
      // No </think> yet, treating entire text as thinking-in-progress
      thinkText = fullText;
    } else {
      thinkText = fullText.substring(0, thinkClose);
      answerText = fullText.substring(thinkClose + '</think>'.length).trim();
      thinkDone = true;
    }
  }

  // Build thinking block HTML
  let thinkHtml = '';
  if (thinkText.trim()) {
    if (!thinkDone) {
      // Still thinking — open + spinner
      thinkHtml = `
        <div class="thinking-block open">
          <button class="thinking-toggle" onclick="this.parentElement.classList.toggle('open')">
            <span class="arrow">▶</span> 💭 推理中… <span class="thinking-spinner"></span>
          </button>
          <div class="thinking-content">${escapeHtml(thinkText.trim())}</div>
        </div>`;
    } else {
      // Thinking done — collapsed
      thinkHtml = `
        <div class="thinking-block">
          <button class="thinking-toggle" onclick="this.parentElement.classList.toggle('open')">
            <span class="arrow">▶</span> 💭 推理过程（点击展开）
          </button>
          <div class="thinking-content">${escapeHtml(thinkText.trim())}</div>
        </div>`;
    }
  }

  // Build answer HTML
  const answerHtml = answerText ? `<div class="answer-content">${renderMarkdown(answerText)}</div>` : '';

  el.innerHTML = thinkHtml + answerHtml;
}

/* ===== Markdown rendering via marked.js (with fallback) ===== */
function renderMarkdown(text) {
  if (!text) return '';
  if (HAS_MARKED) {
    try { return marked.parse(text); }
    catch { /* fall through */ }
  }
  // Fallback: escape HTML and convert newlines to <br>
  return escapeHtml(text).replace(/\n/g, '<br>');
}

/* ===== Copy code button ===== */
function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '✅ 已复制';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '📋 复制'; }, 2000);
  });
}

/* ===== Utils ===== */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function scrollToBottom() {
  requestAnimationFrame(() => { messagesDiv.scrollTop = messagesDiv.scrollHeight; });
}

/* ===== Init ===== */
if (conversations.length > 0) {
  activeConvId = conversations[0].id;
} else {
  activeConvId = null;
}
renderConvList();
renderMessages();
</script>
